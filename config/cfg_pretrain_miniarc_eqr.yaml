# EqR (Equilibrium Reasoners; Huang, Geng, Kolter 2026, arXiv:2605.21488) on Mini-ARC (149 tasks,
# 5x5 grids, 100 augmentations): baseline for the SFPRM Mini-ARC benchmark. The dataset build
# recipe is in the header of config/cfg_pretrain_sfprm_miniarc.yaml.
# Reference numbers: the EqR paper's Table 14 reports Mini-ARC exact accuracy EqR 55.28, TRM 48.35,
# HRM 44.85.
#
# Model: models/equilibrium_reasoning/, ported from github.com/locuslab/EqR @ 134c754.
#
# Launch (one A100-40GB):
#   python pretrain.py --config-name cfg_pretrain_miniarc_eqr

defaults:
  - arch: eqr
  - _self_

hydra:
  output_subdir: null

# [P] Data
data_paths: ['data/miniarc-aug-100']
data_paths_test: []

# The MiniARC evaluator votes over all augmentations of each test puzzle (pass@K), so the test
# split must NOT be capped with eval_max_examples.
evaluators:
  - name: miniarc@MiniARC        # in-run vote pooled over evals 1..k (aggregated_voting default)
  - name: miniarc@MiniARCSingle  # this checkpoint only; logged as eval/MiniARC_single/*

# [P] Schedule
global_batch_size: 768
epochs: 100000
eval_interval: 5000
min_eval_interval: 0
checkpoint_every_eval: true

# [T] Optimisation (TRM ARC recipe; lr / wd in this repo's AdamATan2 units, see OPTIMIZER)
optimizer: adam_atan2
lr: 7.853981633974483e-05          # = [T] 1e-4 * pi/4
lr_min_ratio: 1.0
lr_warmup_steps: 2000
weight_decay: 0.12732395447351627  # = [T] 0.1 * 4/pi, so lr * wd = 1e-5 per step as upstream
beta1: 0.9
beta2: 0.95

puzzle_emb_lr: 1e-2
puzzle_emb_weight_decay: 0.1

ema: true
ema_rate: 0.999
freeze_weights: false
profile_flops: false

# [P]
project_name: sfprm-miniarc
seed: 0

# [E] Architecture (= config/arch/eqr.yaml, written out; plus the puzzle embedding)
arch:
  H_cycles: 3
  L_cycles: 6
  H_layers: 0
  L_layers: 2

  hidden_size: 512
  num_heads: 8
  expansion: 4
  mlp_t: false
  pos_encodings: rope
  board_height: null      # only read by rope2d (impossible here: 16 puzzle tokens + 25 cells)
  board_width: null
  forward_dtype: bfloat16

  halt_max_steps: 16
  halt_exploration_prob: 0.1

  lambda_: 0.95
  noise_scale: 0.01
  H_init_std: 1.0
  L_init_std: 1.0

  puzzle_emb_ndim: 512
  puzzle_emb_len: 16

  loss:
    loss_type: stablemax_cross_entropy
    q_loss_coeff: 0.5
    deep_supervision: true
