# SFPRM (spherical FPRM) on ARC-AGI-1 + ConceptARC,
# 1000 augmentations.
#
# Build the dataset first (README, "Datasets"): data/arc-aug-1000
#
# Launch with torchrun; global_batch_size stays 768 whatever the GPU count, e.g.
#   torchrun --standalone --nproc-per-node=8 pretrain.py --config-name cfg_pretrain_sfprm_arc

defaults:
  - arch: sfprm
  - _self_

hydra:
  output_subdir: null

# Data
data_paths: ['data/arc-aug-1000']
data_paths_test: []

# The ARC evaluator votes over all 1000 augmentations of each evaluation puzzle
# (pass@K), so the test split must NOT be capped with eval_max_examples.
evaluators:
  - name: arc@ARC

# Training
global_batch_size: 768
epochs: 100000
# eval_interval is also the resume granularity (the resume bundle is written at every eval),
# so it is kept at 5000 epochs (~25.9k steps) rather than FPRM's 10000.
eval_interval: 5000
min_eval_interval: 0
checkpoint_every_eval: true

# SFPRM's optimizer recipe
optimizer: muon
muon_lr: 5e-3
muon_momentum: 0.95
lr: 1e-3                   # AdamW side (embeddings, scales, lm_head)
lr_min_ratio: 1.0
lr_warmup_steps: 0         # matched to the FPRM ARC recipe (Table 7: constant LR, no warm-up)
weight_decay: 0.1
beta1: 0.9
beta2: 0.95

puzzle_emb_lr: 1e-2        # sparse SignSGD side, matching the FPRM ARC recipe
puzzle_emb_weight_decay: 0.0

seed: 0
ema: true
ema_rate: 0.999
freeze_weights: false
profile_flops: false

# Architecture (overrides config/arch/sfprm.yaml)
arch:
  H_cycles: 3
  H_layers: 0
  L_cycles: 6
  L_layers: 2
  n_backwards_L: 6

  hidden_size: 512
  num_heads: 8
  expansion: 4
  puzzle_emb_len: 16
  puzzle_emb_ndim: 512
  pos_encodings: rope
  forward_dtype: bfloat16

  # iteration caps: 8 train (as FPRM ARC, Table 7) / 48 eval (see the header)
  max_iter: 8
  max_iter_dist: det
  max_iter_eval: 48

  # spherical fixed-point solver (decay/patience matched to FPRM ARC's eval 0.9 / 5)
  fp_thresh: 0.01
  eta_min: 1.0e-3
  slerp_eps: 1.0e-6
  stepsize: 1.0
  stepsize_decay_train: 0.9
  stepsize_decay_eval: 0.9
  decay_patience: 5

  # spherical block (nGPT-style)
  eigen_lr_init: 0.5
  lambda_inject: 0.1              # the INIT for the learned parameter below
  # Learn the gslerp input-injection fraction instead of fixing it, mirroring how FPRM
  # learns its residual-mix alphas (logit parameter + sigmoid, no weight decay).
  lambda_inject_learnable: true

  # unbounded readout, plain last-iterate readout
  normalize_lm_head: false
  sz_init: 16.0
  eval_readout_best: false

  # Conv matched to FPRM's ARC recipe (Table 7 "1D-conv, kernel 4"): depthwise CAUSAL 1D
  # over the sequence, k=4, no bias. The block l2-normalizes the result back onto the
  # sphere (the conv is a plain linear map and does not preserve norm).
  use_conv: true
  conv_type: conv1d
  conv_kernel_size: 4
  conv_bias: false

  # Tangent-space log-norm regularizer (weight = loss.jacobian_reg_lambda == nu): OFF.
  # n_spectral_samples 0 short-circuits the penalty and stops jacobian_loss being emitted,
  # so eps/delta/xi below and loss.jacobian_reg_lambda are inert.
  n_spectral_samples: 0
  spectral_eps: 1.0e-3
  spectral_delta: 0.05
  spectral_xi: 0.0

  softmax_temp: 1.0
  variational_dropout: 0.1
  weight_dropout: 0.05

  loss:
    loss_type: stablemax_cross_entropy
    q_loss_coeff: 0.5          # trained Q-head (vote tie-break); halting stays fixed-point
    deep_supervision: true
    jacobian_reg_lambda: 0.01  # inert while n_spectral_samples: 0
