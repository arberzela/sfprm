# SFPRM (spherical FPRM) on Mini-ARC (Kim et al., KSB21ST/MINI-ARC),
# 100 augmentations, scored by task-level Pass@1.
#
# Mini-ARC: 149 tasks, every grid exactly 5x5 (seq_len 25 + puzzle-emb tokens), 2-8 demo
# pairs and exactly 1 test pair per task. Transductive like ARC: a task's demo pairs are the TRAIN
# split, its test pair the TEST split, same puzzle identifier.
#
# Build the dataset first:
#   git clone https://github.com/KSB21ST/MINI-ARC raw_data/MINI-ARC
#   python -m dataset.miniarc_to_kaggle --src raw_data/MINI-ARC/data/MiniARC --out raw_data/miniarc
#   python -m dataset.build_miniarc_dataset --num-aug 100          # -> data/miniarc-aug-100
#
# Memory: 26 tokens (1 + 25) -- the whole 768 batch fits on ONE A100-40GB.
#   torchrun --standalone --nproc-per-node=1 pretrain.py --config-name cfg_pretrain_sfprm_miniarc

defaults:
  - arch: sfprm
  - _self_

hydra:
  output_subdir: null

# Data
data_paths: ['data/miniarc-aug-100']
data_paths_test: []

# The MiniARC evaluator votes over all augmentations of each test puzzle (pass@K),
# so the test split must NOT be capped with eval_max_examples.
evaluators:
  - name: miniarc@MiniARC        # in-run vote pooled over evals 1..k (aggregated_voting default)
  - name: miniarc@MiniARCSingle  # this checkpoint only; logged as eval/MiniARC_single/*

# Training (shared Mini-ARC protocol)
global_batch_size: 768
epochs: 100000
eval_interval: 5000        # same value for every method in this benchmark
min_eval_interval: 0
checkpoint_every_eval: true

# SFPRM's optimizer recipe (= the ARC-1 run, with half its Muon LR)
optimizer: muon
muon_lr: 2.5e-3
muon_momentum: 0.95
lr: 1e-3                   # AdamW side (embeddings, scales, lm_head)
lr_min_ratio: 1.0
lr_warmup_steps: 0
weight_decay: 0.1
beta1: 0.9
beta2: 0.95

puzzle_emb_lr: 1e-2
puzzle_emb_weight_decay: 0.0   # = the ARC-1 run

project_name: sfprm-miniarc
seed: 0
ema: true
ema_rate: 0.999
freeze_weights: false
profile_flops: false

# Architecture (overrides config/arch/sfprm.yaml); trunk size matched to FPRM ARC
arch:
  H_cycles: 3
  H_layers: 0
  L_cycles: 6
  L_layers: 2
  n_backwards_L: 6

  hidden_size: 512
  num_heads: 8
  expansion: 4
  puzzle_emb_len: 1          # 1 puzzle-embedding token + 25 grid tokens (ARC-1 run: 16 = 1 + 15 zero registers)
  puzzle_emb_ndim: 512
  pos_encodings: rope
  forward_dtype: bfloat16

  # iteration caps: 8 train (det) / 100 eval (the Mini-ARC protocol). The ARC-1 run evaluated at 48;
  # the eval cap does not affect training, so other caps are a post-hoc eval of the saved checkpoints.
  max_iter: 8
  max_iter_dist: det
  max_iter_eval: 100

  # spherical fixed-point solver
  fp_thresh: 0.01
  eta_min: 1.0e-3
  slerp_eps: 1.0e-6
  stepsize: 1.0
  stepsize_decay_train: 0.9
  stepsize_decay_eval: 0.9
  decay_patience: 5

  # spherical block (nGPT-style)
  eigen_lr_init: 0.5
  lambda_inject: 0.1              # init of the learned gslerp input-injection fraction
  lambda_inject_learnable: true

  # unbounded readout, last-iterate readout
  normalize_lm_head: false
  sz_init: 16.0
  eval_readout_best: false

  # depthwise CAUSAL 1D conv, k=4, no bias (= the ARC-1 run and FPRM's Mini-ARC conv)
  use_conv: true
  conv_type: conv1d
  conv_kernel_size: 4
  conv_bias: false

  # Tangent-space log-norm regularizer: OFF (n_spectral_samples 0 short-circuits it; the
  # spectral_* values and loss.jacobian_reg_lambda below are then inert).
  n_spectral_samples: 0
  spectral_eps: 1.0e-3
  spectral_delta: 0.05
  spectral_xi: 0.0

  softmax_temp: 1.0
  # regularisation: the ARC-1 run's dropout with variational dropout raised to 0.2
  variational_dropout: 0.2
  weight_dropout: 0.05

  loss:
    loss_type: stablemax_cross_entropy
    q_loss_coeff: 0.5          # = the ARC-1 run. Halting stays fixed-point; the trained Q-head
                               # breaks vote ties in the pass@K ranking (evaluators/arc.py sorts by
                               # (count, mean q))
    deep_supervision: true
    jacobian_reg_lambda: 0.01  # inert while n_spectral_samples: 0
