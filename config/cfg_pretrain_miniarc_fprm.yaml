# FPRM on Mini-ARC (149 tasks, 5x5 grids, 100 augmentations) -- baseline for the SFPRM Mini-ARC
# benchmark (config/cfg_pretrain_sfprm_miniarc.yaml has the dataset build recipe).
#
# FPRM trained with a Mini-ARC optimisation recipe (lr 6e-4, 2000-step warm-up, weight decay 0.1, 
# puzzle-emb weight decay 0.1) and all 8 deep-supervision segments per sample.
#
#   python pretrain.py --config-name cfg_pretrain_miniarc_fprm

defaults:
  - arch: fprm
  - _self_

hydra:
  output_subdir: null

# Data
data_paths: ['data/miniarc-aug-100']
data_paths_test: []

evaluators:
  - name: miniarc@MiniARC        # in-run vote pooled over evals 1..k (aggregated_voting default)
  - name: miniarc@MiniARCSingle  # this checkpoint only; logged as eval/MiniARC_single/*

# Training
global_batch_size: 768
epochs: 100000
eval_interval: 5000
min_eval_interval: 0
checkpoint_every_eval: true

optimizer: adam_atan2
lr: 6e-4                   # Mini-ARC recipe (Table 7: 1e-3)
lr_min_ratio: 1.0
lr_warmup_steps: 2000      # Mini-ARC recipe (Table 7: 0)
weight_decay: 0.1          # Mini-ARC recipe (Table 7: 1e-2)
beta1: 0.9
beta2: 0.95

puzzle_emb_lr: 1e-2
puzzle_emb_weight_decay: 0.1   # Mini-ARC recipe (Table 7: 1.0)

project_name: sfprm-miniarc
seed: 0
ema: true
ema_rate: 0.999
freeze_weights: false
profile_flops: false

# Architecture (overrides config/arch/fprm.yaml) -- FPRM's ARC (Table 7) values verbatim except max_iter_eval
# and halting_mechanism
arch:
  halting_mechanism: fixed_iterations   # train all 8 segments (Table 7 / arch default: fixed_point)
  H_cycles: 3            # unused by FPRM (Table 7: "-"); kept for the shared config schema
  H_layers: 0
  L_cycles: 6
  L_layers: 2
  n_backwards_L: 6

  hidden_size: 512
  num_heads: 8
  expansion: 4
  puzzle_emb_len: 16
  puzzle_emb_ndim: 512
  pos_encodings: rope
  forward_dtype: bfloat16

  max_iter: 8
  max_iter_dist: det
  max_iter_eval: 100     # Mini-ARC cap (Table 7's ARC value is 1000)

  alpha_1_init: 0.75
  alpha_2_init: 0.25
  residual_scale: input-independent
  outer_only: false
  norm_type: pre-norm
  norm_placement: output

  conv_type: conv1d
  conv_kernel_size: 4
  conv_bias: false

  fp_thresh: 0.1
  outlier_quantile: 0.25
  stepsize: 1.0
  stepsize_decay_train: 0.9
  stepsize_decay_eval: 0.9
  decay_patience: 5
  eps: 1.0e-8
  init_std: 6.0
  additive_noise_std: 0.0

  softmax_temp: 1.0
  mlp_t: false
  no_ACT_continue: true
  normalize_input_injection: false
  variational_dropout: 0.0
  weight_dropout: 0.0

  loss:
    loss_type: stablemax_cross_entropy
    q_loss_coeff: 0.5
    deep_supervision: true
