# SFPRM (spherical FPRM) on Sudoku-Extreme.
#
# The recipe of the released checkpoint
#   checkpoints/sfprm-sudoku-step97656   (epoch 15k)
#
# Build the dataset first (see the README):
#   python dataset/build_sudoku_dataset.py --output-dir data/sudoku-extreme-5k-aug-200 \
#       --subsample-size 5000 --num-aug 200
#
# Launch with:
#   python pretrain.py --config-name cfg_pretrain_sfprm_sudoku
# or across several GPUs (global_batch_size stays 768):
#   torchrun --standalone --nproc-per-node=4 pretrain.py --config-name cfg_pretrain_sfprm_sudoku

defaults:
  - arch: sfprm
  - _self_

hydra:
  output_subdir: null

# Data
data_paths: ['data/sudoku-extreme-5k-aug-200']
data_paths_test: []
evaluators: []

# Training
global_batch_size: 768
epochs: 60000
eval_interval: 5000
eval_max_examples: 1000   # test set is 422786 examples; max_iter_eval=35000 makes the
                           # full set too slow to eval every eval_interval, so the in-run
                           # eval scores a deterministic 1000-example prefix (optimistic by
                           # ~1.3 pt vs the full test set; see the README for the full eval).

optimizer: muon
muon_lr: 5e-3
muon_momentum: 0.95
lr: 1e-3                   # AdamW side (embeddings, scales, lm_head)
lr_min_ratio: 0.1          # cosine decay to 0.1x over the 60k-epoch schedule
lr_warmup_steps: 200
weight_decay: 0.1
beta1: 0.9
beta2: 0.95

puzzle_emb_lr: 1e-3
puzzle_emb_weight_decay: 0.0

seed: 1                    # seed of the released checkpoints
ema: true
ema_rate: 0.999
checkpoint_every_eval: true
min_eval_interval: 0
freeze_weights: false
profile_flops: false

# Architecture (overrides config/arch/sfprm.yaml)
arch:
  H_cycles: 3
  L_cycles: 6
  H_layers: 0
  L_layers: 2
  n_backwards_L: 6

  hidden_size: 512
  num_heads: 8
  expansion: 4
  puzzle_emb_len: 16
  pos_encodings: rope

  # segment cap
  max_iter: 12
  max_iter_dist: det
  max_iter_eval: 35000

  # spherical fixed-point solver
  fp_thresh: 0.01
  eta_min: 1.0e-3
  slerp_eps: 1.0e-6
  stepsize: 1.0
  stepsize_decay_train: 0.9
  stepsize_decay_eval: 0.99
  decay_patience: 5

  # spherical block (nGPT-style)
  eigen_lr_init: 0.5
  lambda_inject: 0.1              # FIXED on-sphere input-injection fraction ...
  lambda_inject_learnable: false  # ... not learned (true would add lambda_inject_param)

  # unbounded readout, plain last-iterate readout
  normalize_lm_head: false
  sz_init: 16.0
  eval_readout_best: false

  # No conv branch (true would add L_level.conv.weight and break loading the released
  # checkpoints: 6,830,211 dense parameters = fixed lambda and no conv).
  use_conv: false

  # tangent-space log-norm regularizer (Sec. 3.5); weight = loss.jacobian_reg_lambda
  # DISABLED: 0 short-circuits the penalty and stops jacobian_loss being emitted at
  # all, so eps/delta/xi below are inert.
  n_spectral_samples: 0
  spectral_eps: 1.0e-3
  spectral_delta: 0.05
  spectral_xi: 0.0

  softmax_temp: 1.0
  variational_dropout: 0.1
  weight_dropout: 0.1

  loss:
    loss_type: stablemax_cross_entropy
    q_loss_coeff: 0.0          # halting is fixed-point; Q-head is metric-only
    deep_supervision: true
    jacobian_reg_lambda: 0.01  # nu on the log-norm regularizer (inert while n_spectral_samples: 0)
